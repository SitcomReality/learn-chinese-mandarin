<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Chinese Mandarin</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Removed importmap since we're using direct ESM imports -->
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Learn Chinese Mandarin</h1>
            <div class="mode-selector">
                <button id="category-btn" class="active">Categories</button>
                <button id="quiz-btn">Quiz</button>
            </div>
        </header>
        
        <main>
            <div id="categories-section" class="section">
                <div class="category-grid">
                    <!-- Categories will be populated by JS -->
                </div>
            </div>
            
            <div id="phrases-section" class="section hidden">
                <button id="back-to-categories" class="back-button">← Back to Categories</button>
                <h2 id="current-category">Category</h2>
                <div class="phrase-list">
                    <!-- Phrases will be populated by JS -->
                </div>
            </div>
            
            <div id="quiz-section" class="section hidden">
                <div class="quiz-container">
                    <div class="quiz-question">
                        <h2>What does this mean?</h2>
                        <div class="chinese-phrase">你好</div>
                    </div>
                    <div class="quiz-options">
                        <!-- Options will be populated by JS -->
                    </div>
                    <div class="quiz-feedback hidden">
                        <div class="feedback-message"></div>
                        <button class="next-question">Next Question</button>
                    </div>
                </div>
                <div class="quiz-progress">
                    <span id="score">Score: 0</span>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Practice your Mandarin pronunciation and vocabulary daily!</p>
        </footer>
    </div>
</body>
</html>
